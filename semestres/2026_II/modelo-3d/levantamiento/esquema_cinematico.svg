<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 60 1000 470" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">
  <title>Esquema cinemático del brazo XK-JS1-1 (plano r-z)</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <pattern id="tierra" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect x="-70" y="60" width="1000" height="470" fill="#fff"/>

  <!-- Mesa -->
  <rect x="-60" y="470" width="980" height="12" fill="url(#tierra)"/>
  <line x1="-60" y1="470" x2="920" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Eje de giro de la base (theta) -->
  <line x1="220" y1="95" x2="220" y2="478" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="10 4 2 4"/>
  <path d="M190,108 A30,9 0 1 0 250,108" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="256" y="104" fill="#c0392b" font-weight="600">θ base (R1, motor Z)</text>

  <!-- Base giratoria: discos 11, columna 7, bloque 2 (eslabón 1 del plano) -->
  <rect x="150" y="452" width="140" height="18" fill="#d5d8dc" stroke="#333"/>
  <rect x="155" y="438" width="130" height="14" fill="#e5e7e9" stroke="#333"/>
  <rect x="185" y="326" width="70" height="112" fill="#e5e7e9" stroke="#333"/>
  <rect x="170" y="286" width="100" height="40" fill="#cfd8dc" stroke="#333"/>
  <text x="120" y="466" font-size="12">11</text>
  <text x="196" y="390" font-size="12">7</text>
  <text x="178" y="311" font-size="12" font-weight="600">2</text>

  <!-- Bastidor de husillos (eslabón 2): placas 10 y 5, guías 16, husillos, motores -->
  <rect x="40" y="225" width="14" height="110" fill="#aed6f1" stroke="#333"/>
  <rect x="404" y="225" width="14" height="110" fill="#aed6f1" stroke="#333"/>
  <line x1="54" y1="262" x2="404" y2="262" stroke="#2e86c1" stroke-width="3"/>
  <line x1="54" y1="306" x2="404" y2="306" stroke="#2e86c1" stroke-width="3"/>
  <rect x="-2" y="244" width="42" height="34" fill="#5d6d7e" stroke="#333"/>
  <rect x="-2" y="289" width="42" height="34" fill="#5d6d7e" stroke="#333"/>
  <text x="2" y="266" fill="#fff" font-size="11">M_Y</text>
  <text x="2" y="311" fill="#fff" font-size="11">M_X</text>
  <text x="38" y="218" font-size="12">10</text>
  <text x="404" y="218" font-size="12">5</text>
  <text x="320" y="300" font-size="11" fill="#2e86c1">16 + husillo X</text>
  <text x="340" y="256" font-size="11" fill="#2e86c1">16 + husillo Y</text>

  <!-- Bloque 1 (carro Y, eslabón 3) con escuadra 6 -->
  <rect x="230" y="237" width="100" height="50" fill="#f5cba7" stroke="#333"/>
  <polygon points="258,237 302,237 290,140 270,140" fill="#fae5d3" stroke="#333"/>
  <text x="236" y="268" font-size="12" font-weight="600">1</text>
  <text x="274" y="200" font-size="12">6</text>

  <!-- Horquilla 17 en la placa 5 (pivote A) y soporte del poste A' -->
  <rect x="418" y="290" width="22" height="20" fill="#aed6f1" stroke="#333"/>
  <polyline points="418,236 432,236 432,250" fill="none" stroke="#333" stroke-width="2"/>
  <text x="440" y="326" font-size="11">17</text>

  <!-- Brazo 9 + escuadra 8 (eslabón 5, balancín) -->
  <line x1="432" y1="300" x2="704" y2="427" stroke="#7d3c98" stroke-width="7" stroke-linecap="round"/>
  <polygon points="463.7,314.8 518.1,340.2 535.3,232.4" fill="#e8daef" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="600" y="395" font-size="12" fill="#7d3c98">9</text>
  <text x="505" y="300" font-size="12" fill="#7d3c98">8</text>

  <!-- Biela 12 (eslabón 4): C - B -->
  <line x1="280" y1="145" x2="535.3" y2="232.4" stroke="#d35400" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="178" font-size="12" fill="#d35400">12</text>

  <!-- Varilla 13 (eslabón 6) y postes 14: paralelogramo de orientación -->
  <line x1="432" y1="250" x2="704" y2="377" stroke="#229954" stroke-width="3"/>
  <line x1="704" y1="377" x2="704" y2="427" stroke="#229954" stroke-width="4"/>
  <text x="560" y="300" font-size="12" fill="#229954">13</text>
  <text x="712" y="400" font-size="11" fill="#229954">14</text>
  <text x="440" y="246" font-size="11" fill="#229954">14</text>

  <!-- Pinza (eslabón 7): cuerpo 4, mordazas 15 -->
  <rect x="690" y="417" width="100" height="38" fill="#d5f5e3" stroke="#333"/>
  <rect x="790" y="419" width="50" height="9" fill="#abebc6" stroke="#333"/>
  <rect x="790" y="443" width="50" height="9" fill="#abebc6" stroke="#333"/>
  <text x="740" y="441" font-size="12">4</text>
  <text x="808" y="414" font-size="11">15</text>
  <line x1="842" y1="429" x2="852" y2="441" stroke="#c0392b" stroke-width="2"/>
  <line x1="852" y1="429" x2="842" y2="441" stroke="#c0392b" stroke-width="2"/>
  <text x="858" y="430" fill="#c0392b" font-weight="600">TCP</text>

  <!-- Articulaciones de revoluta -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <circle cx="432" cy="300" r="6"/>
    <circle cx="432" cy="250" r="5"/>
    <circle cx="280" cy="145" r="6"/>
    <circle cx="535.3" cy="232.4" r="6"/>
    <circle cx="704" cy="427" r="6"/>
    <circle cx="704" cy="377" r="5"/>
  </g>
  <g font-weight="700" font-size="14">
    <text x="410" y="318">A</text>
    <text x="386" y="248">A'</text>
    <text x="262" y="140">C</text>
    <text x="545" y="230">B</text>
    <text x="684" y="446">E</text>
    <text x="712" y="374">E'</text>
  </g>

  <!-- Ángulo phi del brazo -->
  <line x1="432" y1="300" x2="520" y2="300" stroke="#555" stroke-dasharray="4 3"/>
  <path d="M482,300 A50,50 0 0 1 477.3,321.1" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="486" y="320" font-size="14" font-style="italic">φ</text>

  <!-- Coordenadas articulares -->
  <line x1="54" y1="214" x2="230" y2="214" stroke="#333" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="60" y="208" font-weight="600">s_Y — P2 (carro Y)</text>
  <line x1="270" y1="350" x2="404" y2="350" stroke="#333" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="262" y="368" font-weight="600">s_X (bastidor respecto al bloque 2) — P1</text>

  <!-- Coordenadas cilíndricas del TCP -->
  <line x1="220" y1="505" x2="847" y2="505" stroke="#c0392b" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="520" y="522" fill="#c0392b" font-weight="600">r</text>
  <line x1="895" y1="470" x2="895" y2="435" stroke="#c0392b" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="903" y="458" fill="#c0392b" font-weight="600">z</text>

  <!-- Leyenda -->
  <g font-size="12">
    <rect x="590" y="78" width="330" height="128" fill="#fbfcfc" stroke="#aaa"/>
    <circle cx="606" cy="96" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="618" y="100">Par de revoluta (pasador)</text>
    <rect x="600" y="110" width="14" height="10" fill="#f5cba7" stroke="#333"/>
    <text x="618" y="120">Par prismático (bloque sobre guías 16)</text>
    <text x="600" y="140">Plano r-z: n = 7 eslabones, j = 8 pares (1 GDL c/u)</text>
    <text x="600" y="158">M = 3(n−1) − 2j = 18 − 16 = 2  →  (s_X, s_Y)</text>
    <text x="600" y="176">+ θ base (R1) + garra ON/OFF = 4 GDL</text>
    <text x="600" y="196" fill="#777" font-size="11">Esquema sin escala. Cotas en levantamiento_medidas.md</text>
  </g>
</svg>
