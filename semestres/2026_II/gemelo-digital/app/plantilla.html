<!doctype html>
<html lang="es" class="app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemelo digital · Brazo XK-JS1-1</title>
  <meta name="theme-color" content="#111318">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/sistema.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- three.js 0.160.0 incluido en lib/three: la app funciona sin internet -->
  <script type="importmap">
  { "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
  </script>
  <script>window.RUTA_GLB_BRAZO = 'modelo/brazo_xk-js1-1.glb'; window.GEMELO_CONTROL = true;</script>
</head>
<body class="sd">
  <header class="sd-barra">
    <a class="sd-marca" href="./"><img src="icono.svg" alt=""><span><strong>Gemelo digital · Brazo XK-JS1-1</strong><small>PLC S7-200 · UMSA · II/2026</small></span></a>
    <span class="sd-derecha">
      <span class="sd-pastilla" id="app-conexion">Conectando…</span>
      <span class="sd-pastilla" id="app-mando" hidden></span>
      <button class="sd-boton chico fantasma app-boton-barra" id="instalar" hidden>Instalar app</button>
      <span class="app-usuario" id="app-usuario" hidden></span>
      <a class="sd-boton chico primario" id="app-menu" href="menu" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span id="app-menu-texto">Menú</span>
      </a>
    </span>
  </header>
  <main id="app" class="app-principal">
{{MODELO3D}}
  </main>
  <script src="js/cinematica.js"></script>
  <script src="js/conexion-plc.js"></script>
  <script type="module" src="js/modelo3d.js"></script>
  <script>
    // Barra superior: conexión, mando, usuario, menú e instalación
    (function () {
      const $ = id => document.getElementById(id);
      const yo = window.GEMELO_USUARIO || { usuario: 'local', rol: 'operador', local: true };
      if (yo.menu) { $('app-menu').hidden = false; if (yo.modo) $('app-menu-texto').textContent = 'Menú · ' + yo.modo; }
      if (!yo.local) {
        const us = $('app-usuario');
        us.hidden = false;
        us.append(yo.usuario + ' · ' + yo.rol + ' ');
        const a = document.createElement('a'); a.href = 'salir'; a.className = 'sd-boton chico fantasma app-boton-barra'; a.textContent = 'Salir'; us.append(a);
      }
      async function ver() {
        const con = $('app-conexion'), man = $('app-mando');
        try {
          const r = await fetch('api/estado', { cache: 'no-store' });
          if (r.status === 401) { location.href = 'login'; return; }
          if (r.status === 503 && yo.menu) { location.href = 'menu'; return; }
          const e = await r.json();
          con.className = 'sd-pastilla ' + (e.conectado ? 'ok' : 'mal');
          con.textContent = e.conectado ? 'PLC conectado · ' + e.perfil : 'Sin PLC' + (e.error ? ': ' + e.error : '');
          con.title = e.error || '';
          man.hidden = !e.conectado;
          man.className = 'sd-pastilla ' + (e.mando && e.mando_de === yo.usuario ? 'ok' : e.mando ? 'aviso' : '');
          man.textContent = !e.mando ? 'Sin mando' : e.mando_de === yo.usuario ? 'Usted tiene el mando' : 'Mando: ' + e.mando_de;
        } catch (err) {
          con.className = 'sd-pastilla mal';
          con.textContent = 'La app no responde';
          man.hidden = true;
        }
        setTimeout(ver, 1000);
      }
      ver();
      let aviso = null;
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); aviso = e; $('instalar').hidden = false; });
      $('instalar').addEventListener('click', async () => { if (!aviso) return; aviso.prompt(); await aviso.userChoice; aviso = null; $('instalar').hidden = true; });
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    })();
  </script>
</body>
</html>
