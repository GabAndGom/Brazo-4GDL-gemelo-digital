<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemelo digital · Brazo XK-JS1-1</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- three.js 0.160.0 incluido en lib/three: la app funciona sin internet -->
  <script type="importmap">
  { "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
  </script>
  <script>window.RUTA_GLB_BRAZO = 'modelo/brazo_xk-js1-1.glb'; window.GEMELO_CONTROL = true;</script>
</head>
<body>
  <header class="app-barra">
    <img src="icono.svg" alt="" width="28" height="28">
    <div>
      <strong>Gemelo digital · Brazo XK-JS1-1</strong>
      <small>PLC S7-200 por USB-PPI · UMSA II-2026</small>
    </div>
    <a class="app-menu" id="app-menu" href="menu" hidden>☰ Menú</a>
    <span class="app-conexion" id="app-conexion">Conectando…</span>
    <span class="app-usuario" id="app-usuario" hidden></span>
  </header>
  <main id="app" class="app-principal">
{{MODELO3D}}
  </main>
  <script src="js/cinematica.js"></script>
  <script src="js/conexion-plc.js"></script>
  <script type="module" src="js/modelo3d.js"></script>
  <script>
    // Estado de la conexión en la barra superior
    (function () {
      const el = document.getElementById('app-conexion');
      const yo = window.GEMELO_USUARIO || { usuario: 'local', rol: 'operador', local: true };
      const us = document.getElementById('app-usuario');
      const menu = document.getElementById('app-menu');
      if (yo.menu) { menu.hidden = false; if (yo.modo) menu.textContent = '☰ Menú · ' + yo.modo; }
      if (!yo.local) {
        us.hidden = false;
        us.innerHTML = '';
        us.append(yo.usuario + ' · ' + yo.rol + ' ');
        const a = document.createElement('a'); a.href = 'salir'; a.textContent = 'Salir'; us.append(a);
      }
      async function ver() {
        try {
          const r = await fetch('api/estado', { cache: 'no-store' });
          if (r.status === 401) { location.href = 'login'; return; }
          if (r.status === 503 && yo.menu) { location.href = 'menu'; return; }
          const e = await r.json();
          const mando = !e.mando ? 'sin mando' : e.mando_de === yo.usuario ? 'USTED TIENE EL MANDO' : 'mando: ' + e.mando_de;
          el.className = 'app-conexion ' + (e.conectado ? 'ok' : 'mal');
          el.textContent = e.conectado
            ? 'PLC conectado · ' + e.perfil + ' · ' + mando
            : 'Sin PLC' + (e.error ? ': ' + e.error : '');
        } catch (err) {
          el.className = 'app-conexion mal';
          el.textContent = 'La app no responde';
        }
        setTimeout(ver, 1000);
      }
      ver();
    })();
  </script>
</body>
</html>
